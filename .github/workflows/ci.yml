name: CI

on:
  push:
    branches: [main, "test/**"]
  pull_request:

jobs:
  quality:
    name: Typecheck, tests, coverage, audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      # Known high CVEs come from Prisma 6 internals (deepmerge-ts, effect);
      # the only fix is a breaking upgrade to Prisma 7. Reported, not blocking.
      # See the ISO report, section 6.6 (SCA).
      - name: npm audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
